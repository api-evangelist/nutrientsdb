name: NutrientsDB normalized nutrient schema
description: The 86 normalized nutrient field names used on every NutrientsDB food record, in both the free 1,000-food
  Sample API and the full downloadable dataset. All values are per 100 g of the food, the standard basis for food
  composition data. A value is null when the source does not report that nutrient. The measurement unit is encoded
  as a suffix on the field name.
basis: per 100 g of food
null_semantics: null means the source did not report the nutrient — it does not mean zero.
