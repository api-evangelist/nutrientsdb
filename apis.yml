name: NutrientsDB
description: >-
  A curated global food-composition dataset of roughly 2.9 million food entries across 86 normalized nutrient fields,
  deduplicated across 180+ countries and sold under a one-time license as a downloadable file for local use rather than
  as a hosted, metered API. Every nutrient value is expressed per 100 g of food, with the unit encoded as a suffix on
  the field name, and a null value means the source did not report that nutrient rather than that the value is zero.
  NutrientsDB fronts the licensed dataset with a free, keyless, read-only Sample API that exposes a public 1,000-food
  slice carrying the identical 86-field schema, so developers, researchers, and AI builders can inspect the shape and
  density of the data before licensing it. The same sample is mirrored as plain JSON on GitHub and Hugging Face.
