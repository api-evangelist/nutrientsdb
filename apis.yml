apis:
  - name: NutrientsDB Sample API
    description: >-
      Free, keyless, read-only REST API providing access to the public 1,000-food sample with the full 86-field
      normalized nutrient schema. A single operation, findFoods, supports case-insensitive search by food name (q) or
      exact lookup by public_id (id), capped at 20 results with no cursor or offset. No authentication, HTTPS only,
      wildcard CORS. A 404 means the food is not in the free sample, not that it is absent from NutrientsDB — the full
      ~2.9M-food dataset is a licensed download and is not queryable through this endpoint.
    humanURL: https://www.nutrientsdb.com/api/docs
