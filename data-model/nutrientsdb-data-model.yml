description: >-
  Entity graph for the NutrientsDB Sample API, derived from the OpenAPI components.schemas $ref
  links. This is a flat reference-data model, not a relational one: there is exactly one domain
  entity (Food), no cross-entity foreign keys, and no write path. The other schemas are response
  envelopes rather than entities, and they are recorded as such so an agent does not mistake
  SearchResponse for a resource it can address.
