observations:
  - No foreign keys between entities — Food is self-contained; nutrients are inline, not a joined table.
  - No category, source-country, or provenance field is exposed on the sample record, even though the
    full dataset is described as deduplicated across 180+ countries.
  - No write, patch, or delete operations exist; the model is read-only.
